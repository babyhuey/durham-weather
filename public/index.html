<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Durham Weather</title>
<meta name="theme-color" content="#56697f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='13' r='7' fill='%23f5c451'/%3E%3Cpath d='M9 26a6 6 0 0 1 1-11.9A7 7 0 0 1 23.4 16 5 5 0 0 1 23 26z' fill='%23dfe7f1'/%3E%3C/svg%3E">
<script>
  try { const t = localStorage.getItem('wx:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@200;400;500&family=Figtree:wght@400;500;600&display=swap">
<style>
  :root {
    --sky-top: #56697f;
    --sky-bottom: #aebacb;
    --ink: #ffffff;
    --ink-soft: rgba(255, 255, 255, 0.78);
    --glass: rgba(255, 255, 255, 0.16);
    --glass-edge: rgba(255, 255, 255, 0.24);
    --rule: rgba(255, 255, 255, 0.2);
    --rain: #d6ecff;
    --veil: 0;
    --ground: var(--sky-top);
    --display: 'Jost', 'Futura', 'Avenir Next', system-ui, sans-serif;
    --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #eef3fa;
      --ink-soft: rgba(238, 243, 250, 0.66);
      --glass: rgba(6, 11, 22, 0.42);
      --glass-edge: rgba(255, 255, 255, 0.1);
      --rule: rgba(255, 255, 255, 0.1);
      --rain: #9fd0ff;
      --veil: 0.62;
      --ground: #0d1522;
    }
  }
  :root[data-theme="dark"] {
    --ink: #eef3fa;
    --ink-soft: rgba(238, 243, 250, 0.66);
    --glass: rgba(6, 11, 22, 0.42);
    --glass-edge: rgba(255, 255, 255, 0.1);
    --rule: rgba(255, 255, 255, 0.1);
    --rain: #9fd0ff;
    --veil: 0.62;
    --ground: #0d1522;
  }
  * { box-sizing: border-box; }
  body::after { content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none; background: #050a14; opacity: var(--veil); transition: opacity 0.3s ease; }
  .topbar { position: relative; z-index: 2; max-width: 960px; margin: -12px auto 8px; display: flex; justify-content: flex-end; }
  .theme { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-edge); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .theme button { font: inherit; font-size: 12px; font-weight: 600; color: var(--ink-soft); background: none; border: 0; border-radius: 999px; padding: 4px 11px; margin: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .theme button[aria-pressed="true"] { color: #10203a; background: rgba(255, 255, 255, 0.88); text-shadow: none; }
  .theme svg { width: 13px; height: 13px; }
  html { min-height: 100%; background: var(--ground); }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.4;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
    padding-inline: max(16px, env(safe-area-inset-left, 0px));
    padding-block: calc(28px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px));
  }
  body::before { content: ''; position: fixed; inset: 0; z-index: 0; background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%); }
  #drizzle { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  .app { position: relative; z-index: 2; max-width: 440px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: start; }
  @media (min-width: 820px) {
    .app { max-width: 960px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
    .now { grid-column: 1 / -1; }
  }
  @media (min-width: 1100px) {
    body { font-size: 16px; }
    html .topbar { max-width: 1240px; }
    html .app {
      max-width: 1240px; gap: 22px 24px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-areas: "now now air" "note note note" "next days days" "radar days days" "hours hours hours" "foot foot foot";
    }
    html .col { display: contents; }
    html .now { grid-area: now; justify-content: flex-start; gap: 64px; }
    html .hero { width: 240px; }
    html .quip { font-size: 15px; }
    html .temp { font-size: 148px; }
    html .area-note { grid-area: note; }
    html .next-card { grid-area: next; }
    html .radar-card { grid-area: radar; }
    html .air-card { grid-area: air; align-self: center; }
    html .days-card { grid-area: days; }
    html .hours-card { grid-area: hours; }
    html .foot-area { grid-area: foot; }
    html .next-text { font-size: 21px; }
    html .hours { grid-auto-columns: minmax(64px, 1fr); }
    html .hours .h-icon .wx { width: 42px; height: 42px; }
    html .hours .h-temp { font-size: 17px; }
    html .hours .bar { height: 56px; }
    html .day { grid-template-columns: 60px 40px minmax(0, 1fr) 52px 96px 70px 60px; padding-block: 13px; font-size: 16px; }
    html .day .d-icon .wx { width: 38px; height: 38px; }
    html .day .d-cond { font-size: 15px; }
  }
  .tab { font-variant-numeric: tabular-nums; }

  .now { padding-block: 4px 6px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .now-text { min-width: 0; }
  .hero { margin: 0; flex: 0 0 auto; width: clamp(130px, 36vw, 230px); text-align: center; }
  .hero .wx { width: 100%; height: auto; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.18)); }
  .quip { font-size: 13px; line-height: 1.3; color: var(--ink); font-style: italic; margin-top: 2px; text-wrap: balance; }
  @media (max-width: 480px) {
    .now { align-items: flex-start; }
    .hero { width: 124px; margin-top: 18px; }
    .quip { font-size: 12px; }
  }

  .wx [class] { transform-box: fill-box; transform-origin: center; }
  .wx .spin { animation: wx-spin 24s linear infinite; }
  .wx .bob { animation: wx-bob 4s ease-in-out infinite; }
  .wx .slide { animation: wx-slide 5s ease-in-out infinite alternate; }
  .wx .fall { animation: wx-fall 1.1s linear infinite; }
  .wx .fall.slow { animation-duration: 2.4s; }
  .wx .flash { animation: wx-flash 2.6s steps(1) infinite; }
  .wx .twinkle { animation: wx-twinkle 2.2s ease-in-out infinite; }
  .wx .drift { animation: wx-drift 3.2s linear infinite; }
  .wx .zzz { animation: wx-zzz 3s ease-out infinite; }
  .wx .gust { animation: wx-gust 1.6s linear infinite; }
  .wx .tumble { animation: wx-tumble 2.4s linear infinite; }
  .wx .dangle { animation: wx-dangle 1.6s ease-in-out infinite alternate; transform-origin: top center; }
  .wx .drip { animation: wx-drip 2.2s ease-in infinite; }
  .wx .shimmer { animation: wx-shimmer 1.8s ease-in-out infinite alternate; }
  .wx-static *, .wx-static { animation: none !important; }
  @media (prefers-reduced-motion: reduce) { .wx * { animation: none !important; } }
  @keyframes wx-spin { to { transform: rotate(360deg); } }
  @keyframes wx-bob { 50% { transform: translateY(-4px); } }
  @keyframes wx-slide { from { transform: translateX(-5px); } to { transform: translateX(6px); } }
  @keyframes wx-fall { from { transform: translateY(0); opacity: 1; } to { transform: translateY(22px); opacity: 0; } }
  @keyframes wx-flash { 0%, 100% { opacity: 0; } 8%, 14% { opacity: 1; } 10% { opacity: 0.2; } }
  @keyframes wx-twinkle { 50% { opacity: 0.25; transform: scale(0.7); } }
  @keyframes wx-drift { from { transform: translate(0, -14px) rotate(0); opacity: 0; } 20% { opacity: 1; } to { transform: translate(-6px, 14px) rotate(180deg); opacity: 0; } }
  @keyframes wx-zzz { from { transform: translate(0, 0); opacity: 0; } 30% { opacity: 1; } to { transform: translate(10px, -16px); opacity: 0; } }
  @keyframes wx-gust { from { stroke-dashoffset: 80; } to { stroke-dashoffset: 0; } }
  @keyframes wx-tumble { from { transform: translate(-30px, 6px) rotate(0); opacity: 0; } 20% { opacity: 1; } to { transform: translate(14px, -18px) rotate(540deg); opacity: 0; } }
  @keyframes wx-dangle { from { transform: rotate(-12deg) scaleY(0.9); } to { transform: rotate(12deg) scaleY(1.15); } }
  @keyframes wx-drip { from { transform: translateY(0) scaleY(1); } 70% { transform: translateY(4px) scaleY(1.4); opacity: 1; } to { transform: translateY(16px); opacity: 0; } }
  @keyframes wx-shimmer { to { transform: translateY(-4px); opacity: 0.4; } }
  .search { position: relative; z-index: 5; max-width: 440px; margin: 0 auto 14px; }
  .search input { box-sizing: border-box; width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 999px; padding: 9px 16px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .search input::placeholder { color: var(--ink-soft); }
  .search input:focus { outline: 2px solid rgba(255, 255, 255, 0.55); outline-offset: 1px; }
  .search ul { position: absolute; left: 0; right: 0; top: calc(100% + 6px); margin: 0; padding: 6px; list-style: none; border-radius: 16px; background: rgb(14, 22, 38); color: #eef3fa; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35); }
  .search li { padding: 10px 12px; border-radius: 10px; cursor: pointer; text-shadow: none; }
  .search li[data-i]:hover { background: rgba(255, 255, 255, 0.1); }
  .search li small { color: rgba(238, 243, 250, 0.6); margin-left: 6px; }
  .search li.label { cursor: default; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(238, 243, 250, 0.6); padding: 8px 12px 4px; }
  .search li.mine { font-weight: 600; }
  .place { font-size: 16px; font-weight: 500; }
  .place small { font-weight: 400; color: var(--ink-soft); font-size: 14px; }
  .temp { font-family: var(--display); font-weight: 200; font-size: clamp(88px, 26vw, 128px); line-height: 0.95; letter-spacing: -0.04em; margin: 4px 0 2px; }
  .cond { font-size: 16px; color: var(--ink-soft); }
  .source { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }

  .glass {
    background: var(--glass);
    border: 1px solid var(--glass-edge);
    border-radius: 20px;
    padding: 16px;
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
  }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 10px; }

  .next-text { font-size: 19px; line-height: 1.35; margin: 0; text-wrap: pretty; }
  .next-meta { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; font-size: 14px; color: var(--ink-soft); }

  .quarters { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; margin-top: 14px; text-align: center; font-size: 11px; }
  .q-bar { height: 30px; display: flex; align-items: flex-end; border-radius: 4px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
  .q-bar i { width: 100%; background: var(--rain); border-radius: 4px; }
  .q-amt { height: 14px; color: var(--rain); font-size: 10px; }
  .q-time { color: var(--ink-soft); }
  .q-caption { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .next-foot { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; font-size: 12px; color: var(--ink-soft); }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .air-card { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .gauge { min-width: 0; }
  .gauge .label { margin-bottom: 6px; }
  .g-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .g-num { font-family: var(--display); font-weight: 200; font-size: 44px; line-height: 1; }
  .g-cat { font-weight: 600; font-size: 12px; line-height: 1.2; color: #10203a; text-shadow: none; padding: 3px 9px; border-radius: 999px; align-self: center; }
  .meter { position: relative; height: 6px; border-radius: 3px; margin: 10px 0 8px; }
  .meter.aqi { background: linear-gradient(90deg, #3ec46d 0 16.7%, #f2d34b 16.7% 33.3%, #ff9a3c 33.3% 50%, #ff5a5a 50% 66.7%, #b36bff 66.7% 100%); }
  .meter.uv { background: linear-gradient(90deg, #3ec46d 0 25%, #f2d34b 25% 50%, #ff9a3c 50% 66.7%, #ff5a5a 66.7% 91.7%, #b36bff 91.7% 100%); }
  .meter i { position: absolute; top: 50%; width: 12px; height: 12px; margin-left: -6px; transform: translateY(-50%); border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.25); }
  .g-note { font-size: 12px; color: var(--ink-soft); }
  .g-quip { font-size: 13px; font-style: italic; margin-top: 4px; text-wrap: pretty; }
  .radar-card { display: block; color: inherit; text-decoration: none; transition: transform 0.15s ease, border-color 0.15s ease; }
  .radar-card:hover { border-color: rgba(255, 255, 255, 0.5); transform: translateY(-1px); }
  .radar-card .label { margin: 0; }
  .rc-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .rc-when { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: rgba(126, 195, 255, 0.28); }
  #rc-canvas { display: block; width: 100%; aspect-ratio: 16 / 9; height: auto; border-radius: 12px; background: rgba(8, 14, 26, 0.55); }
  .rc-foot { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; font-size: 12px; color: var(--ink-soft); }
  .rc-open { color: var(--ink); font-weight: 600; white-space: nowrap; }
  .hours { display: grid; grid-auto-flow: column; grid-auto-columns: 46px; gap: 4px; overflow-x: auto; text-align: center; font-size: 12px; padding-bottom: 6px; scrollbar-width: thin; }
  .hours .h-temp { font-size: 15px; font-weight: 500; }
  .hours .h-icon .wx { width: 34px; height: 34px; margin-top: 4px; }
  .hours .bar { width: 9px; height: 40px; margin: 6px auto; display: flex; align-items: flex-end; border-radius: 5px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
  .hours .bar i { width: 100%; border-radius: 5px; background: var(--rain); }
  .hours .h-pop { color: var(--rain); }
  .hours .h-wind { margin-top: 6px; font-size: 12px; white-space: nowrap; }
  .gust { display: block; font-size: 10px; color: #ffe39a; white-space: nowrap; }

  .day .d-icon .wx { width: 32px; height: 32px; display: block; }
  .day { display: grid; grid-template-columns: 50px 32px minmax(0, 1fr) 38px 74px 52px 44px; gap: 8px; align-items: center; padding: 9px 0; border-top: 1px solid var(--rule); font-size: 15px; }
  .day:first-of-type { border-top: 0; }
  .day .d-cond { font-size: 13px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .day .d-pop { font-size: 13px; color: var(--rain); text-align: right; }
  .day .d-range, .day .d-wind, .day .d-total { text-align: right; white-space: nowrap; }
  .day .d-range .lo { color: var(--ink-soft); }
  .day .d-wind, .day .d-total { font-size: 14px; }
  .day.day-key { padding-block: 0 8px; margin-top: -4px; font-size: 11px; color: var(--ink-soft); }
  .day.day-key span { font-size: 11px; color: var(--ink-soft); }
  @media (max-width: 480px) {
    .day { grid-template-columns: 42px 30px minmax(0, 1fr) 70px 50px 40px; gap: 6px; }
    .day .d-cond { display: none; }
  }

  .foot { font-size: 12px; color: var(--ink-soft); text-align: center; margin-top: 4px; }
  .foot a { color: inherit; }
  .notice { font-size: 13px; background: rgba(0, 0, 0, 0.18); border-radius: 12px; padding: 10px 12px; }
  .notice[hidden] { display: none; }
  .error { text-align: center; padding: 28px 16px; }
  button {
    font: inherit; font-weight: 600; color: var(--ink); background: var(--glass); border: 1px solid var(--glass-edge);
    border-radius: 999px; padding: 8px 18px; margin-top: 12px; cursor: pointer;
  }
  button:focus-visible, a:focus-visible, .hours:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .loading { color: var(--ink-soft); }
</style>
</head>
<body>
<canvas id="drizzle" aria-hidden="true"></canvas>
<div class="topbar">
  <div class="theme" role="group" aria-label="Color theme">
    <button type="button" data-theme-choice="auto" aria-pressed="false" title="Match your device"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>Auto</button>
    <button type="button" data-theme-choice="light" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Light</button>
    <button type="button" data-theme-choice="dark" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 1.8a6.5 6.5 0 1 0 3.7 9.6A5.5 5.5 0 0 1 10.5 1.8z" fill="currentColor"/></svg>Dark</button>
  </div>
</div>
<div class="search">
  <input id="search-input" type="search" placeholder="Search a city or ZIP" autocomplete="off" enterkeyhint="search" role="combobox" aria-label="Search for a place" aria-controls="search-list" aria-expanded="false">
  <ul id="search-list" role="listbox" hidden></ul>
</div>
<main class="app" id="app" aria-live="polite">
  <section class="now">
    <div class="place">Durham</div>
    <div class="temp tab">--°</div>
    <div class="cond loading">Loading forecast…</div>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
